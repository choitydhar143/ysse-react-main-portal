<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123b35" />
    <meta name="description" content="YSSE Main Portal — a student-built demonstration of a youth-focused multi-page portal." />
    <title>YSSE | Main Portal</title>
    <script>
      // Restore deep links after GitHub Pages serves its 404 fallback.
      (function (location) {
        if (location.search && location.search[1] === '/') {
          var decoded = location.search.slice(1).split('&')[0].replace(/~and~/g, '&');
          var newUrl = location.pathname.replace(/\/$/, '') + decoded +
            location.search.slice(1 + decoded.length) + location.hash;
          window.history.replaceState(null, '', newUrl);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
