<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | YSSE Main Portal</title>
    <script>
      // GitHub Pages fallback for BrowserRouter deep links.
      var repoBase = '/ysse-main-portal';
      var path = window.location.pathname;
      var route = path.indexOf(repoBase) === 0 ? path.slice(repoBase.length) : path;
      var redirect = repoBase + '/?/' + route.replace(/^\//, '') +
        (window.location.search ? '&' + window.location.search.slice(1) : '') +
        window.location.hash;
      window.location.replace(redirect);
    </script>
  </head>
  <body>Redirecting to the requested YSSE page…</body>
</html>
